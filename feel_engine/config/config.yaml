# 體感模組設定（SPEC 第 3 節）。改了 data／labels／weighting／features／modules.version_map 要重新 build；
# 其餘只要重跑 run／evaluate。

seed: 42

data:
  merchant: TCG                      # 商戶
  currency: PHP                      # 幣別（只讀該幣別的注單）
  game: "22071"                      # 遊戲代號；三者決定快取與輸出的資料夾（feel_engine/paths.py）
  train_start: "2026-09-28"          # 美東；訓練期間第一天
  train_end: "2026-10-11"            # 美東；訓練期間最後一天（含）
  valid_start: "2026-10-12"          # 美東；驗證期間第一天，須晚於 train_end（中間可以空幾天）
  valid_end: "2026-10-18"            # 美東；驗證期間最後一天（含）；AUC、葉子 × 版本留存率都在驗證期間計算
  pre_hours: 6                       # 往前多讀：判斷午夜後的手是否接續前一天的 session（是 → 整段歸前一天）
  post_hours: 12                     # 截尾：session 須在起點隔天 0 點 + 此值前結束，否則整段不抽

compute:                             # 只影響速度與記憶體
  n_buckets: 48                      # 一次 build 讀 5 天以上 16 桶、14 天以上 32 桶、20 天以上 48 桶
  workers: 2

modules:
  version_map:                       # game_version → 原版本；未填完時 build 只輸出版本分佈後停止
    "22071_1.0.0_0": null            # （build --provisional-arm 可先以 game_version 暫代 arm）
    "22071_1.0.0_1": null
    "22071_1.0.0_2": null
    "22071_1.0.0_3": null
    "22071_1.0.0_5": null
  rtp_level: {low: 96.0, mid: 96.5, high: 97.0}   # 設計值；low 為暫定
  design:                            # 波動度 × 倍率 × RTP；source = 提供離線資料的原版本
    M1: {name: 保護傘, volatility: mid,  multiplier: mid,  rtp: high, source: 保護傘}
    M2: {name: 標準,   volatility: mid,  multiplier: mid,  rtp: mid,  source: 原模組}
    M3: {name: 冷卻,   volatility: mid,  multiplier: mid,  rtp: low,  source: null}
    M4: {name: 驚喜,   volatility: mid,  multiplier: high, rtp: high, source: 高倍數}
    M5: {name: 高倍數, volatility: high, multiplier: high, rtp: mid,  source: 高倍數}
    M6: {name: 高波動, volatility: high, multiplier: mid,  rtp: mid,  source: 深模組}
    M7: {name: 極限,   volatility: high, multiplier: high, rtp: low,  source: null}
  baseline: 原模組
  deployable: [M1, M2, M4, M5, M6]   # M3、M7 實作後再加入

labels:
  session_gap_minutes: 30            # 相鄰付費手間隔超過此值 → 切 session
  churn_window_spins: 20             # Y 的窗口，同時是決策間隔
  return_window_hours: 24            # session 結束後此時間內沒回來 → 流失
  arm_dominance: 0.8                 # 窗口內主版本佔比 ≥ 此值的決策點才抽入樣本

weighting:
  player_day_cap: 50                 # 每位玩家每天的權重總和上限

splits:                              # split = all／lifecycle（SEG_lifecycle）／value（SEG_value）
  min_segment_train_n: 10000         # 一棵樹的訓練期間決策點至少幾筆（all 樹也適用）；群少於此數 → 沿用 all 的樹
  groups:                            # 指定 split 只對這些群建模；未列出的群在該 split 不建模、不評估
    value: [低, 中, 高]

regroup:                             # 讀入 dataset 時併類別（dataset 不動、不用 build）；TAG_ 與對應的 SEG_ 分群一起改
  TAG_lifecycle: {流失: 回流}         # 流失併入回流：X、傾向分數、lifecycle 分群都只剩五類

features:
  derived:
    dry_min_spins: 100               # GP_flag_dryLong：今日手數下限
    cold_nowin_rate: 0.8             # NGP_flag_coldLoss：今日 NO_WIN 比例下限
    loss_ratio: 0.3                  # NGP_flag_coldLoss：balance 相對 session 起始的跌幅

tree:                                # all 樹與分群樹共用
  max_depth: 4
  min_impurity_decrease: 0.00005     # 每次切分至少要讓加權不純度下降多少；0 = 只要有改善就切
  min_samples_leaf: 1000             # 每片葉子至少幾筆訓練期間決策點

leaf_eval:                           # SPEC 9.1、9.2
  min_n_per_arm: 300                 # 每片葉子 × 每個版本在共同範圍內至少幾筆，才納入比較
  dominant_share: 0.8                # 可比較的版本不到兩個、且同一版本佔葉子超過此值 → 維持現狀（不計入信心分數、不合併）
  propensity_model: logistic         # logistic = 多項式邏輯迴歸；gbm = 梯度提升樹
  balance_calibration: true          # 葉子內校準：讓各版本加權後的平均狀態對齊共同範圍
  balance_tolerance: 0.1             # 校準目標：各共變數的加權平均與共同範圍相差 ≤ 此值個標準差
  overlap_min: 0.05                  # 共同範圍：每個比較版本的傾向分數都 ≥ 此值的決策點
  min_overlap_share: 0.8             # 共同範圍至少涵蓋葉子此比例；做不到 → 選涵蓋最多的組合，信心最多「低」
  smd_threshold: 0.2                 # 平衡：加權後各共變數與共同範圍相差不到此值個標準差
  similar_merge_over_leaves: 8       # 合併相同建議後仍超過此片數的樹，才再併建議不同、但都不是高信心的相鄰葉子
  bootstrap_reps: 300

five_feelings:                       # 五個體感補位（SPEC 9.4）；變體的設定在 feel_engine/variants.py
  enabled: true                      # false → 不補位、實驗頁沒有五個體感分頁
  max_loss_pp: 2.0                   # 補位版本比原建議低不超過此值（加權留存率點估計，百分點）
  min_comparable_share: 0.5          # 子規則內可比區至少佔此比例
  many_trees: 3                      # 實驗的決策樹超過此數 → 每個待補版本補 placements_many_trees 片
  placements_many_trees: 2           # 同一版本的各片必須在不同的樹
  min_per_tree: 0                    # 每棵樹至少補幾片（0 = 不要求）
  force_coverage: false              # true：門檻內補不到時，改用門檻外的候選（標「超過門檻」）
  every_version_per_tree: false      # true：每棵樹的葉子沒建議到的版本，都在該樹內補一片
  sub_rule_depth: 2                  # 子規則最多幾個條件
five_feelings_2:                     # 「五個體感2」分頁 = five_feelings 再覆蓋這些值（變體頁不產生）
  every_version_per_tree: true
  force_coverage: true               # 只放寬可比區佔比；比原建議低超過 max_loss_pp 的位置仍不用
