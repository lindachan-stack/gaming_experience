# 決策樹（SPEC 第 8 節）的特徵與實驗設定。樹的超參數與分群門檻在 config.yaml 的 tree、splits。
#
# - 每個欄位寫成「欄位: 中文名稱」；中文名稱用在實驗 HTML 的樹圖與規則。不要的欄位在前面加 # 註解掉。
# - 只能用 dataset 中 GP_／SY_／NGP_／TAG_ 開頭的欄位；索引、arm、arm_ratio、SEG_、churnNext20、w_cap 放入會報錯。
# - 每個實驗的 X = fast ＋ tags[該實驗的 tags]。
# - 特徵在決策點那一手「下注後、開獎前」計算，都不用當手的開獎結果。
#   「今日」= 美東 0 點起、到當手之前的所有付費手（與遊戲端水池一致）；今日首手的比率類特徵是 0 ÷ 0 → 缺值。
#
# 執行：bash run_experiments.sh                                    # 依 experiments 的順序全部跑完並比較
#      python -m feel_engine.cli run --split all --tags lifecycle   # 只跑一組

fast:                                          # 快層：每個實驗都放
  # ── GP_：水池，只用今日當手之前的手 ──
  - GP_dailySpinCount: 今日已玩手數
  - GP_dailyRate_NO_WIN: 今日未中比例             # 0 倍
  - GP_dailyRate_TINY_WIN: 今日小於1倍比例
  - GP_dailyRate_SMALL_WIN: 今日1至7倍比例
  - GP_dailyRate_MEDIUM_WIN: 今日7至30倍比例
  - GP_dailyRate_BIG_WIN: 今日30倍以上比例
  - GP_dailyRtp: 今日RTP                        # Σ贏分 ÷ Σ下注（現行版本分派依此切換）
  - GP_dailyRate_MEDIUM_PLUS: 今日7倍以上比例     # MEDIUM ＋ BIG
  - GP_dailyNoWin_x_spins: 今日未中比例×log手數   # 未中比例 × log1p(今日手數)
  # - GP_flag_dryLong: 今日久旱                    # 今日 ≥ 100 手且沒中過 ≥ 7 倍 → 1
  - GP_dailyRate_FREE_GAME: 今日FreeGame比例     # 含 FreeGame 的手（game_mode 位元 2，含 BUY 手）
  # ── SY_：系統端，當手開獎前已知 ──
  - SY_bet: 當手下注額
  - SY_isBuyFeature: 當手購買特色
  - SY_balance: 當手下注前餘額
  - SY_balanceToBet: 當手下注前餘額÷當手下注額     # 還能玩幾手
  - SY_first_balance: session起始餘額            # 本 session 第一手下注前餘額
  # ── NGP_：水池與系統端的組合 ──
  - NGP_dailyTotalWinToBet: 今日總贏分÷當手下注額
  # - NGP_flag_coldLoss: 手冷且虧損                # 今日未中 ≥ 80% 且餘額比 session 起始少 ≥ 30% → 1

tags:                                    # 慢層組合：名稱 → 加進 X 的 TAG_ 欄位（決策週之前最新一筆週標籤）
  none: []
  lifecycle:
    - TAG_lifecycle: 生命週期                    # 流失／一般／新手／下滑／活躍／回流（無紀錄 → 新手）
  value:
    - TAG_value_combined: 價值等級               # one-hot 只取低／中／高（見 categories）
  lifecycle_value:
    - TAG_lifecycle: 生命週期
    - TAG_value_combined: 價值等級
  # 其他可用：TAG_source（標籤取自 W-1／更早／無紀錄）、TAG_is_zero_fill（取到的是否為補零列）

experiments:                             # 要跑的實驗；順序 = 實驗比較的順序
  - {split: all,       tags: none}
  - {split: all,       tags: lifecycle}
  - {split: all,       tags: value}
  - {split: all,       tags: lifecycle_value}
  - {split: lifecycle, tags: none}
  - {split: lifecycle, tags: value}
  - {split: value,     tags: none}       # value 分群只建模低／中／高（config.yaml splits.groups.value）
  - {split: value,     tags: lifecycle}

categories:                              # 文字欄位只對列出的類別做 one-hot；其他類別全為 0，不會成為分支條件
  TAG_value_combined: [低, 中, 高]

missing:
  fill: -1                               # 數值缺值填補值
  add_isna: false                        # true：有缺值的數值欄位另加 <欄位>_isna（0／1）
